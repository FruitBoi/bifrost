# Bifröst optional startup configuration.
#
# Copy this file to <BF_CONFIG_PATH>/config.yml (BF_CONFIG_PATH defaults to
# ./config; in Docker it is the mounted /config volume, next to data.sqlite).
# config.yaml and config.json are accepted too, and BF_CONFIG_FILE can point to
# a file anywhere else. The file is optional: when it is missing, every value
# below applies as its default. Keys you leave out keep their defaults, unknown
# keys are logged as warnings, and a value of the wrong type stops startup.
# Restart the bot after editing; the file is read once at startup.

permissions:
    # Request Manage Threads in the bot invite links. It lets the bot rename
    # threads it does not own, but also lets it delete and archive any thread,
    # so it is off by default. Threads the bridge creates are owned by the bot
    # and can be renamed without it.
    manageThreads: false

threads:
    # Mirror thread renames between linked threads.
    mirrorRenames: true
    # When a linked thread is deleted on one side, delete its counterpart too.
    # Requires permissions.manageThreads on Discord and the matching right on
    # Fluxer; the counterpart is otherwise left in place and only the link is
    # removed.
    mirrorDeletes: false

categories:
    # Mirror Discord channel renames to the category-created Fluxer thread.
    mirrorChannelRenames: true
    # Drop the link when a channel is moved out of a linked category.
    unlinkWhenChannelLeaves: true

roles:
    # Every role-based command permission lives in this one section. Each list
    # names the role IDs whose members may run the commands of that group; a
    # member needs at least one of them. IDs are matched on the platform the
    # command is run on: Fluxer role IDs only ever match Fluxer members and
    # Discord role IDs only Discord members, so list IDs from both platforms
    # if a group should work on both. Quote the IDs: unquoted numbers lose
    # precision when parsed.

    # Moderator commands: `clean` (aliases `clear`, `cl`). The default is a
    # Fluxer role, so nobody can run `clean` on Discord until you add a
    # Discord role ID here.
    moderator:
        - "1561105750388908139"
    # Identity commands (Fluxer only). `!b map <@user> <discordUserId>`
    # maps the mentioned Fluxer member and that Discord user to each other,
    # so pings of either are bridged to the other, when neither account is
    # mapped yet. `!b role <@user> <discordUserId>` does the same (replacing
    # an existing mapping; one mapping per account), adds every Fluxer role
    # named like one of that Discord user's roles, and adds the member to
    # every bridged thread the Discord user is in. This key used to be called
    # `copyAllowedRoleIds`; the old name is still accepted (with a warning)
    # and ignored if `identity` is set too.
    identity:
        - "1561105750388908139"
        - "1561105750388908112"
    # Bridge role pings. A role mention (`@Role`) in a bridged message pings
    # the role with the same name in the linked server on the other platform
    # (names are matched like custom emojis and `!b role`), in both
    # directions. The role is only pinged there if the author could ping it
    # on their own side (the role is mentionable, or the author has Mention
    # Everyone). Without a same-named role the mention is relayed as
    # plaintext `@RoleName` and nobody is pinged. @everyone and @here are
    # never bridged, and editing a bridged message never pings again. Set to
    # false to relay every role mention as plaintext.
    bridgeMentions: true

clean:
    # YAGPDB-style bulk delete: `clean <num> [user]` deletes the last `num`
    # messages (1-100) in the channel, or only those by the given user, and
    # switches narrow it down (`-r <regex>`, `-ma <time>`, `-minage <time>`,
    # `-nopin`, `-a`, `-bots`, `-from <id>`, `-to <id>`; see the README).
    # Aliases `clear` and `cl`. It looks through the last 1000 messages at
    # most; on Discord messages older than two weeks cannot be bulk-deleted.
    # Works on both Discord and Fluxer, is restricted to roles.moderator, and
    # deleted bridged messages are deleted on the other side too.
    enabled: true
    # Prefixes that trigger `clean` without the bot prefix, so `?clean 10` and
    # `!clean 10 -bots` work (same for `?clear` and `?cl`). A space and a
    # capital after the prefix, as phone keyboards add (`? Clean 10`), are
    # accepted. The bot prefix form `!b clean ...` always works while clean is
    # enabled. An empty list ([]) disables the shortcuts. `!` is a common
    # prefix for other bots, so you may want to keep only "?" if they would
    # answer too. Quote them.
    triggerPrefixes:
        - "?"
        - "!"

history:
    # Message history transfer: `history` (alias `backfill`), run inside a
    # linked channel or thread, copies that channel's history to its
    # counterpart on the other platform, oldest first, in the style of bridged
    # messages (webhook name and avatar, a timestamp line on each copy).
    # `history` copies the last defaultCount messages, `history 250` the last
    # 250 (up to maxCount), `history all` everything after `history confirm`.
    # Switches: `-ma <time>`, `-after <id>`, `-before <id>`, `-digest` (many
    # messages per transcript post), `-notime`; see the README. Already bridged
    # or transferred messages are skipped, so re-running is safe and resumes.
    # Transfers run in the background one at a time (`history status`,
    # `history stop`), never ping anyone, work on both platforms and are
    # restricted to roles.moderator.
    enabled: true
    # Messages copied when no count is given.
    defaultCount: 100
    # Largest count accepted as a number; anything bigger needs `all`.
    maxCount: 1000
    # Pause between two posts on the destination, in milliseconds. 1000 posts
    # at 1000 ms take about 17 minutes. Keep it at or above the default: both
    # platforms rate-limit webhooks, and Fluxer IP-bans bots that exceed its
    # limits.
    delayMs: 1000

meow:
    # Answer Fluxer messages that are nothing but cat noises (meow, mrrp, nya,
    # purr and stretched or decorated variants) with a cat noise, as if
    # chatting back. Only Fluxer users are answered; Discord users, bots and
    # bridged messages are ignored. In a linked channel the reply is bridged
    # like any other message.
    enabled: true

reminders:
    # YAGPDB-style reminders: `remindme <time> <message>` pings you back in the
    # channel after the given time (at most 10 years ahead, 25 reminders per
    # user), and `reminder list | channel | delete <id> | delete -a` manages
    # them. Works on both Discord and Fluxer; reminders are not bridged.
    enabled: true
    # Prefixes that trigger the reminder commands without the bot prefix, so
    # `?remindme 1h30min take the pizza out` and `!remindme ...` work (same for
    # `?reminders`, `?reminder delete 3`, ...). A space and a capital after
    # the prefix, as phone keyboards add (`? Remindme ...`), are accepted. The
    # bot prefix form `!b remindme ...` always works while reminders are
    # enabled. An empty list ([]) disables the shortcuts. `!` is a common
    # prefix for other bots, so you may want to keep only "?" if they would
    # answer too. Quote them.
    triggerPrefixes:
        - "?"
        - "!"

reactions:
    # Mirror reactions on bridged messages (channels and threads, originals and
    # webhook copies alike) onto the counterpart message on the other platform.
    # Webhooks cannot react, so the other side sees one reaction from the bot
    # per emoji, not one per person; it is removed once nobody on the source
    # side has that reaction any more. Unicode emojis are mirrored as-is, a
    # custom emoji only when the other server has one with the same name. The
    # bot needs Add Reactions on both platforms; installations invited before
    # reaction bridging must grant it to the bot's role or re-invite the bot.
    enabled: true
