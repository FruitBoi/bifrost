name: Code Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        task: [lint, format:check, build, test]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install -g pnpm
      - run: pnpm install
      - run: pnpm run ${{ matrix.task }}

  dashboard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install -g pnpm
      - run: pnpm install
      - run: pnpm --dir dashboard exec tsc -p tsconfig.app.json --noEmit
      - run: pnpm --dir dashboard build
